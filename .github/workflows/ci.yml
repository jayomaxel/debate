name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: sqlite:///./ci_test.db
      SECRET_KEY: ci-secret-key
      PUBLIC_BASE_URL: http://localhost:8860
      ALLOWED_ORIGINS: http://localhost:8860,http://127.0.0.1:8860
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run work package C backend tests
        run: >
          python -m pytest
          tests/test_upload_guard.py
          tests/test_audit_service.py
          tests/test_rate_limit.py
          tests/test_auth_session.py
          tests/test_websocket_ticket.py
          tests/test_config_masking.py
          tests/test_health_check.py
          -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend type check
        run: pnpm type-check

      - name: Build frontend
        run: pnpm build
