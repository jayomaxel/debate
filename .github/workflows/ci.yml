name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: debate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d debate_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: development
      DEBUG: "false"
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/debate_ci
      PUBLIC_BASE_URL: http://localhost:8860
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8860,http://127.0.0.1:8860
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info
      - name: Install Python dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Compile backend sources
        run: python -m compileall -q api
      - name: Run Alembic migrations
        working-directory: api
        run: alembic upgrade head
      - name: Run backend tests
        run: |
          python -m pytest \
            api/tests/test_admin_secret_masking.py \
            api/tests/test_websocket_ticket.py \
            api/tests/test_upload_guard.py \
            api/tests/test_audit_service.py \
            api/tests/test_rate_limit.py \
            api/tests/test_auth_session.py \
            api/tests/test_config_masking.py \
            api/tests/test_health_check.py \
            api/tests/test_teaching_design_service.py \
            api/tests/test_topic_recommendation.py \
            api/tests/test_teacher_topic_recommendation_routes.py \
            api/tests/test_report_score_readiness.py \
            api/tests/test_teacher_student_contracts.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: web
        run: pnpm run type-check
      - name: Run frontend smoke tests
        working-directory: web
        run: |
          pnpm exec vitest run \
            src/lib/debate-description.test.ts \
            src/lib/debate-transcript.test.ts \
            src/lib/student-assessment-onboarding.test.ts \
            src/services/auth.service.test.ts \
            src/services/student.service.test.ts
      - name: Build frontend
        working-directory: web
        run: pnpm run build
