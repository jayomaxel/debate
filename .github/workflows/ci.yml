name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-fast:
    name: Backend fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
      - name: Install Python dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Compile backend sources
        run: python -m compileall -q api
      - name: Run isolated unit and contract tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: fast-test-secret-key-with-at-least-32-characters
        run: python -m pytest -q api/tests -m "not integration and not pgvector and not e2e"

  backend-integration:
    name: PostgreSQL Redis PDF integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: debate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d debate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: integration-test-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/debate_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/debate_ci
      TEST_PGVECTOR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/debate_ci
      RUNTIME_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/debate_ci
      RUNTIME_TEST_REDIS_HOST: localhost
      RUNTIME_TEST_REDIS_PORT: "6379"
      RUNTIME_TEST_REDIS_DB: "15"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "15"
      REDIS_PASSWORD: ""
      PUBLIC_BASE_URL: http://localhost:8860
      ALLOWED_ORIGINS: http://localhost:8860,http://127.0.0.1:8860
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
      - name: Install Python dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Migrate an empty PostgreSQL database
        working-directory: api
        run: alembic upgrade head
      - name: Verify migrations and real dependency contracts
        run: |
          python -m pytest -q \
            api/tests/test_migration_020.py \
            api/tests/test_migration_021.py \
            api/tests/test_migration_022.py \
            api/tests/test_migration_023.py \
            api/tests/test_background_job_postgres.py \
            api/tests/test_runtime_state_concurrency.py \
            api/tests/test_websocket_multi_instance.py \
            api/tests/test_file_object_authorization.py \
            api/tests/test_student_report_pdf_cache.py \
            api/tests/test_markdown_pdf.py
      - name: Verify pgvector mismatch and rebuild last
        run: python -m pytest -q api/tests/test_kb_vector_rebuild.py

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: pnpm run lint
      - name: Type check
        working-directory: web
        run: pnpm run type-check
      - name: Run all frontend tests
        working-directory: web
        run: pnpm run test:run
      - name: Build frontend
        working-directory: web
        run: pnpm run build

  docker-e2e:
    name: Complete Docker release gate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: [backend-fast, backend-integration, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run production-dependency E2E suite
        run: >-
          docker compose -f docker-compose.test.yml up --build
          --abort-on-container-exit --exit-code-from e2e e2e
      - name: Start two API instances and gateway
        run: >-
          docker compose -f docker-compose.test.yml --profile stack up
          -d --build --wait web
      - name: Run gateway smoke
        run: bash scripts/run-production-smoke.sh http://127.0.0.1:18860
      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml --profile stack logs --no-color
      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml --profile stack down --volumes --remove-orphans

  provider-smoke:
    name: Controlled real-provider smoke
    if: github.event_name == 'workflow_dispatch'
    needs: [backend-fast, backend-integration, frontend]
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: ${{ secrets.PRODUCTION_SMOKE_BASE_URL }}
      SMOKE_ACCOUNT: ${{ secrets.PRODUCTION_SMOKE_ACCOUNT }}
      SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
      SMOKE_USER_TYPE: ${{ secrets.PRODUCTION_SMOKE_USER_TYPE }}
      PROVIDER_BASE_URL: ${{ secrets.PROVIDER_BASE_URL }}
      PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
      PROVIDER_MODEL: ${{ secrets.PROVIDER_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require controlled smoke secrets
        run: |
          test -n "$SMOKE_BASE_URL"
          test -n "$PROVIDER_BASE_URL"
          test -n "$PROVIDER_API_KEY"
          test -n "$PROVIDER_MODEL"
      - name: Test deployed app and real provider
        run: bash scripts/run-production-smoke.sh
